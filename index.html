<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积存金收益计算器（独立手续费）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .calculator-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #27ae60;
        }

        .btn-calc {
            width: 100%;
            padding: 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-calc:hover {
            background-color: #219653;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 12px;
            display: none;
        }

        .result-title {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .profit-positive {
            color: #e74c3c;
            font-weight: bold;
        }
        
        .profit-negative {
            color: #27ae60;
            font-weight: bold;
        }

        .tip {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        .calc-type {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        
        .calc-type label {
            margin: 0;
            cursor: pointer;
        }
        
        .input-group {
            display: none;
        }
        
        .input-group.active {
            display: block;
        }

        .safe-price {
            margin-top: 15px;
            padding: 12px;
            background-color: #e8f5e9;
            border-left: 4px solid #27ae60;
            border-radius: 8px;
            font-size: 15px;
            color: #2e7d32;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="calculator-box">
        <h2 class="title">💰 积存金收益计算器</h2>
        
        <!-- 计算方式选择 -->
        <div class="calc-type">
            <label>
                <input type="radio" name="calcType" value="weight" checked> 按克数计算
            </label>
            <label>
                <input type="radio" name="calcType" value="amount"> 按购买总金额计算
            </label>
        </div>

        <!-- 按克数计算的输入项 -->
        <div class="input-group active" id="weightGroup">
            <div class="form-group">
                <label>买入价格（元/克）</label>
                <input type="number" id="buyPrice" placeholder="请输入买入单价" step="0.01">
            </div>

            <div class="form-group">
                <label>卖出价格（元/克）</label>
                <input type="number" id="sellPrice" placeholder="请输入卖出单价" step="0.01">
            </div>

            <div class="form-group">
                <label>买入克数（克）</label>
                <input type="number" id="weight" placeholder="请输入持有克数" step="0.01">
            </div>
        </div>
        
        <!-- 按总金额计算的输入项 -->
        <div class="input-group" id="amountGroup">
            <div class="form-group">
                <label>买入价格（元/克）</label>
                <input type="number" id="buyPrice2" placeholder="请输入买入单价" step="0.01">
            </div>

            <div class="form-group">
                <label>卖出价格（元/克）</label>
                <input type="number" id="sellPrice2" placeholder="请输入卖出单价" step="0.01">
            </div>

            <div class="form-group">
                <label>购买总金额（元）</label>
                <input type="number" id="buyAmount" placeholder="请输入购买总金额" step="0.01">
                <div class="tip">注：购买总金额为扣除手续费前的金额</div>
            </div>
        </div>

        <!-- 手续费设置 -->
        <div class="form-group">
            <label>买入手续费率（%）</label>
            <input type="number" id="buyFeeRate" placeholder="默认0.1%" value="0.1" step="0.01">
        </div>

        <div class="form-group">
            <label>卖出手续费率（%）</label>
            <input type="number" id="sellFeeRate" placeholder="默认0.1%" value="0.1" step="0.01">
        </div>

        <button class="btn-calc" onclick="calcProfit()">立即计算收益</button>

        <div class="result-box" id="result">
            <h3 class="result-title">📊 计算结果</h3>
            <div class="result-item">
                <span>买入总金额：</span>
                <span id="buyTotal">0.00 元</span>
            </div>
            <div class="result-item">
                <span>实际持有克数：</span>
                <span id="holdWeight">0.00 克</span>
            </div>
            <div class="result-item">
                <span>卖出总金额：</span>
                <span id="sellTotal">0.00 元</span>
            </div>
            <div class="result-item">
                <span>买入手续费：</span>
                <span id="buyFee">0.00 元</span>
            </div>
            <div class="result-item">
                <span>卖出手续费：</span>
                <span id="sellFee">0.00 元</span>
            </div>
            <div class="result-item">
                <span>总手续费：</span>
                <span id="totalFee">0.00 元</span>
            </div>
            <div class="result-item">
                <span>持仓价差毛利：</span>
                <span id="grossProfit">0.00 元</span>
            </div>
            <div class="result-item">
                <span><b>最终净收益：</b></span>
                <span id="netProfit" class="profit-positive">0.00 元</span>
            </div>

            <!-- 新增：保本卖出价提示 -->
            <div class="safe-price" id="safePriceTip"></div>
        </div>
    </div>

    <script>
        // 切换计算方式
        const calcTypeRadios = document.querySelectorAll('input[name="calcType"]');
        const weightGroup = document.getElementById('weightGroup');
        const amountGroup = document.getElementById('amountGroup');
        
        calcTypeRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'weight') {
                    weightGroup.classList.add('active');
                    amountGroup.classList.remove('active');
                } else {
                    weightGroup.classList.remove('active');
                    amountGroup.classList.add('active');
                }
            });
        });

        function calcProfit() {
            // 获取手续费率
            const buyFeeRate = parseFloat(document.getElementById('buyFeeRate').value) || 0;
            const sellFeeRate = parseFloat(document.getElementById('sellFeeRate').value) || 0;
            
            // 获取计算方式
            const calcType = document.querySelector('input[name="calcType"]:checked').value;
            
            let buyPrice, sellPrice, weight, buyTotal, buyAmount;
            
            // 按克数计算
            if (calcType === 'weight') {
                buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
                sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
                weight = parseFloat(document.getElementById('weight').value) || 0;

                // 校验
                if (buyPrice <= 0 || sellPrice <= 0 || weight <= 0) {
                    alert('请输入有效的价格和克数！');
                    return;
                }
                
                // 计算买入总金额（扣除手续费前）
                buyTotal = buyPrice * weight;
            } 
            // 按购买总金额计算
            else {
                buyPrice = parseFloat(document.getElementById('buyPrice2').value) || 0;
                sellPrice = parseFloat(document.getElementById('sellPrice2').value) || 0;
                buyAmount = parseFloat(document.getElementById('buyAmount').value) || 0;

                // 校验
                if (buyPrice <= 0 || sellPrice <= 0 || buyAmount <= 0) {
                    alert('请输入有效的价格和购买总金额！');
                    return;
                }
                
                // 计算实际持有克数
                const buyFee = buyAmount * (buyFeeRate / 100);
                const actualBuyAmount = buyAmount - buyFee;
                weight = actualBuyAmount / buyPrice;
                buyTotal = buyAmount;
            }

            // 计算收益
            const sellTotal = sellPrice * weight;
            const buyFee = buyTotal * (buyFeeRate / 100);
            const sellFee = sellTotal * (sellFeeRate / 100);
            const totalFee = buyFee + sellFee;
            const grossProfit = sellTotal - buyTotal;
            const netProfit = grossProfit - totalFee;

            // —— 新增：计算【保本卖出价】
            const breakEvenSellPrice = (buyPrice * (1 + buyFeeRate/100)) / (1 - sellFeeRate/100);
            document.getElementById('safePriceTip').innerText = 
                `✅ 保本提示：卖出价 ≥ ${breakEvenSellPrice.toFixed(2)} 元/克 才能获得正收益`;

            // 显示结果
            document.getElementById('buyTotal').innerText = buyTotal.toFixed(2) + ' 元';
            document.getElementById('holdWeight').innerText = weight.toFixed(4) + ' 克';
            document.getElementById('sellTotal').innerText = sellTotal.toFixed(2) + ' 元';
            document.getElementById('buyFee').innerText = buyFee.toFixed(2) + ' 元';
            document.getElementById('sellFee').innerText = sellFee.toFixed(2) + ' 元';
            document.getElementById('totalFee').innerText = totalFee.toFixed(2) + ' 元';
            document.getElementById('grossProfit').innerText = grossProfit.toFixed(2) + ' 元';
            
            // 净收益颜色
            const netProfitEl = document.getElementById('netProfit');
            netProfitEl.innerText = netProfit.toFixed(2) + ' 元';
            if (netProfit >= 0) {
                netProfitEl.className = 'profit-positive';
            } else {
                netProfitEl.className = 'profit-negative';
            }

            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
